; ============================================================
;    SnowFoxOS v3 — Polybar Config
;    Design: Floating bar, pill workspaces, einheitliche Sprache
; ============================================================

[colors]
; ── Basis ──────────────────────────────────────────────────
bg          = #1a1825
bg-bar      = #201e2e
bg-module   = #2a2840
bg-pill     = #332f50
fg          = #e0d9f5
fg-dim      = #6e6a8a
fg-muted    = #4a4760

; ── Akzente ────────────────────────────────────────────────
purple      = #9d6fe8
purple-lt   = #b899ff
purple-dim  = #5c3d99
green       = #89c98a
yellow      = #e8c97a
orange      = #e8946a
red         = #e87a7a
cyan        = #7acfe8

; ── Transparenz ────────────────────────────────────────────
transparent = #00000000

; ============================================================
;    Base Bar (geerbt von beiden Bars)
; ============================================================
[bar/base]
width         = 100%
offset-x      = 0
offset-y      = 0
height = 36
radius = 0
fixed-center = true

background = ${colors.bg-bar}
foreground = ${colors.fg}

; Kein border — picom gibt den Schatten
border-size   = 0
line-size     = 0

; Innenabstand der Bar
padding-left  = 1
padding-right = 1

; Abstand zwischen Modulen
module-margin-left  = 0
module-margin-right = 0

; Schriften
font-0 = "JetBrainsMono Nerd Font:style=Medium:size=9;2"
font-1 = "JetBrainsMono Nerd Font:style=Bold:size=9;2"
font-2 = "JetBrainsMono Nerd Font:size=12;3"
font-3 = "JetBrainsMono Nerd Font:size=8;2"

wm-restack = i3
override-redirect = false

; Tray
tray-position   = right
tray-maxsize    = 14
tray-padding    = 5
tray-background = ${colors.bg-bar}
tray-offset-y   = 0

border-bottom-size  = 2
border-bottom-color = ${colors.purple}

; ============================================================
;    Desktop Bar
; ============================================================
[bar/snowfox]
inherit = bar/base
modules-left   = launcher gap workspaces
modules-center = date
modules-right = memory gap network gap pulseaudio gap bluetooth gap tray-spacer


; ============================================================
;    Laptop Bar
; ============================================================
[bar/snowfox-laptop]
inherit = bar/base
modules-left   = launcher gap workspaces
modules-center = date
modules-right = backlight gap battery gap memory gap network gap pulseaudio gap bluetooth gap tray-spacer


; ============================================================
;    Hilfs-Module
; ============================================================

; Leerer Abstand
[module/gap]
type = custom/text
content = "·"
content-foreground = ${colors.fg-muted}
content-padding = 1

; Tray-Puffer damit Icons nicht am Rand kleben
[module/tray-spacer]
type = custom/text
content = "  "
content-foreground = ${colors.transparent}


; ============================================================
;    Launcher / Menü
; ============================================================
[module/launcher]
type = custom/text
content = %{A1:rofi -show drun -theme ~/.config/rofi/config.rasi:}  󰄛 %{A}
content-font = 2
content-foreground = ${colors.purple-lt}
content-background = ${colors.bg-pill}
content-padding = 2


; ============================================================
;    Workspaces
; ============================================================
[module/workspaces]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false

label-mode         = %mode%
label-mode-padding = 2
label-mode-foreground = ${colors.orange}
label-mode-background = ${colors.bg-pill}

; Aktiver Workspace — lila Pill
label-focused            = %name%
label-focused-foreground = ${colors.fg}
label-focused-background = ${colors.purple-dim}
label-focused-padding    = 2
label-focused-font       = 2

; Inaktive Workspaces
label-unfocused            = %name%
label-unfocused-foreground = ${colors.fg-dim}
label-unfocused-background = ${colors.bg-module}
label-unfocused-padding    = 2

; Dringend
label-urgent            = %name%
label-urgent-foreground = ${colors.red}
label-urgent-background = ${colors.bg-module}
label-urgent-padding    = 2

; Sichtbar aber nicht fokussiert (anderer Monitor)
label-visible            = %name%
label-visible-foreground = ${colors.fg-muted}
label-visible-background = ${colors.bg-module}
label-visible-padding    = 2


; ============================================================
;    Uhr (Mitte)
; ============================================================
[module/date]
type     = internal/date
interval = 1

; Klick wechselt zwischen kurz und lang
date     =  %H:%M
date-alt =  %H:%M   %a, %d.%m.%Y

format           = <label>
format-background = ${colors.bg-module}
format-padding   = 3

label            = %date%
label-font       = 2
label-foreground = ${colors.fg}


; ============================================================
;    RAM
; ============================================================
[module/memory]
type     = internal/memory
interval = 4

format           = <label>
format-prefix    = "󰍛 "
format-prefix-font = 3
format-prefix-foreground = ${colors.cyan}
format-background = ${colors.bg-module}
format-padding   = 2

label            = %percentage_used%%
label-foreground = ${colors.fg}


; ============================================================
;    Netzwerk
; ============================================================
[module/network]
type           = internal/network
interface-type = wireless
interval       = 4
unknown-as-up  = true

format-connected          = <label-connected>
format-connected-prefix   = "󰤨 "
format-connected-prefix-font = 3
format-connected-prefix-foreground = ${colors.green}
format-connected-background = ${colors.bg-module}
format-connected-padding  = 2
label-connected           = %essid%
label-connected-foreground = ${colors.fg}

format-disconnected          = <label-disconnected>
format-disconnected-prefix   = "󰤭 "
format-disconnected-prefix-font = 3
format-disconnected-prefix-foreground = ${colors.fg-muted}
format-disconnected-background = ${colors.bg-module}
format-disconnected-padding  = 2
label-disconnected           = offline
label-disconnected-foreground = ${colors.fg-muted}


; ============================================================
;    Lautstärke
; ============================================================
[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false

format-volume            = <label-volume>
format-volume-prefix     = "󰕾 "
format-volume-prefix-font = 3
format-volume-prefix-foreground = ${colors.purple-lt}
format-volume-background = ${colors.bg-module}
format-volume-padding    = 2
label-volume             = %percentage%%
label-volume-foreground  = ${colors.fg}

format-muted             = <label-muted>
format-muted-prefix      = "󰖁 "
format-muted-prefix-font = 3
format-muted-prefix-foreground = ${colors.fg-muted}
format-muted-background  = ${colors.bg-module}
format-muted-padding     = 2
label-muted              = stumm
label-muted-foreground   = ${colors.fg-muted}

click-right = pavucontrol &


; ============================================================
;    Batterie
; ============================================================
[module/battery]
type         = internal/battery
battery      = BAT1
adapter      = ACAD
poll-interval = 10
full-at      = 99
low-at       = 15

format-charging            = <label-charging>
format-charging-prefix     = "󰂄 "
format-charging-prefix-font = 3
format-charging-prefix-foreground = ${colors.green}
format-charging-background = ${colors.bg-module}
format-charging-padding    = 2
label-charging             = %percentage%%
label-charging-foreground  = ${colors.fg}

format-discharging            = <label-discharging>
format-discharging-prefix     = "󰁹 "
format-discharging-prefix-font = 3
format-discharging-prefix-foreground = ${colors.yellow}
format-discharging-background = ${colors.bg-module}
format-discharging-padding    = 2
label-discharging             = %percentage%%
label-discharging-foreground  = ${colors.fg}

format-full            = <label-full>
format-full-prefix     = "󰁹 "
format-full-prefix-font = 3
format-full-prefix-foreground = ${colors.green}
format-full-background = ${colors.bg-module}
format-full-padding    = 2
label-full             = voll
label-full-foreground  = ${colors.fg}

format-low            = <label-low>
format-low-prefix     = "󰂃 "
format-low-prefix-font = 3
format-low-prefix-foreground = ${colors.red}
format-low-background = ${colors.bg-module}
format-low-padding    = 2
label-low             = %percentage%%!
label-low-foreground  = ${colors.red}


; ============================================================
;    Helligkeit (Laptop)
; ============================================================
[module/backlight]
type = internal/backlight
card = intel_backlight
use-actual-brightness = true
enable-scroll = true

format            = <label>
format-prefix     = "󰃠 "
format-prefix-font = 3
format-prefix-foreground = ${colors.yellow}
format-background = ${colors.bg-module}
format-padding    = 2
label             = %percentage%%
label-foreground  = ${colors.fg}

; ============================================================
;    Bluetooth
; ============================================================
[module/bluetooth]
type = custom/script
interval = 3
exec = ~/.config/polybar/scripts/bluetooth.sh
click-left = ~/.config/polybar/scripts/bluetooth.sh toggle

format            = <label>
format-background = ${colors.bg-module}
format-padding    = 2
label             = %output%
label-foreground  = ${colors.fg}
