; ============================================================
;    SnowFoxOS v3 — Polybar Config (SnowFox Palette Enhanced)
; ============================================================

[colors]
bg        = #1e1e2e
bg-alt    = #252538
bg-pill   = #2d2d44
fg        = #cdd6f4
fg-dim    = #7f849c
purple    = #8139e8
purple-lt = #a366ff
green     = #a6e3a1
orange    = #ff79c6
red       = #f38ba8
cyan      = #89dceb
yellow    = #f9e2af

; ============================================================
;    Desktop Bar
; ============================================================
[bar/snowfox]
width = 100%
height = 30
radius = 0
fixed-center = true
background = ${colors.bg}
foreground = ${colors.fg}
line-size = 2
border-size = 0
padding-left = 1
padding-right = 1
module-margin-left = 0
module-margin-right = 0

font-0 = "JetBrainsMono Nerd Font:style=Bold:size=9.5;2"
font-1 = "JetBrainsMono Nerd Font:size=11;2"
font-2 = "JetBrainsMono Nerd Font:size=13;3"

modules-left   = menu sep workspaces
modules-center = date
modules-right  = memory sep-r network sep-r pulseaudio sep-r bluetooth

wm-restack = i3
override-redirect = false

tray-position    = right
tray-maxsize     = 16
tray-padding     = 4
tray-background  = ${colors.bg}

; ============================================================
;    Laptop Bar
; ============================================================
[bar/snowfox-laptop]
inherit = bar/snowfox
modules-right = backlight sep-r battery sep-r memory sep-r network sep-r pulseaudio sep-r bluetooth

; ============================================================
;    Separator Modules
; ============================================================
[module/sep]
type = custom/text
content = "  "
content-foreground = ${colors.bg}

[module/sep-r]
type = custom/text
content = "  "
content-foreground = ${colors.bg}

; ============================================================
;    Fuchs Menü
; ============================================================
[module/menu]
type = custom/text
content = %{A1:rofi -show drun -theme ~/.config/rofi/config.rasi:} 󰄛 %{A}
content-font = 3
content-foreground = ${colors.purple-lt}
content-background = ${colors.bg-alt}
content-padding = 1

; ============================================================
;    Workspaces
; ============================================================
[module/workspaces]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
label-mode = %mode%
label-mode-padding = 1
label-mode-foreground = ${colors.orange}

label-focused = %name%
label-focused-foreground = ${colors.fg}
label-focused-background = ${colors.bg-pill}
label-focused-underline = ${colors.purple}
label-focused-padding = 1

label-unfocused = %name%
label-unfocused-foreground = ${colors.fg-dim}
label-unfocused-padding = 1

label-urgent = %name%
label-urgent-foreground = ${colors.red}
label-urgent-background = ${colors.bg-alt}
label-urgent-padding = 1

label-visible = %name%
label-visible-foreground = ${colors.fg-dim}
label-visible-padding = 1

; ============================================================
;    Uhr
; ============================================================
[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %H:%M  %a %d.%m.%Y
format = <label>
format-prefix = "󰥔 "
format-prefix-font = 2
format-prefix-foreground = ${colors.purple-lt}
label = %date%
label-foreground = ${colors.fg}

; ============================================================
;    RAM
; ============================================================
[module/memory]
type = internal/memory
interval = 3
format = <label>
format-prefix = "󰍛 "
format-prefix-font = 2
format-prefix-foreground = ${colors.cyan}
label = %percentage_used%%
label-foreground = ${colors.fg}

; ============================================================
;    Netzwerk
; ============================================================
[module/network]
type = internal/network
interface-type = wireless
interval = 3
format-connected = <label-connected>
format-connected-prefix = "󰤨 "
format-connected-prefix-font = 2
format-connected-prefix-foreground = ${colors.green}
label-connected = %essid%
label-connected-foreground = ${colors.fg}

format-disconnected = <label-disconnected>
format-disconnected-prefix = "󰤭 "
format-disconnected-prefix-font = 2
format-disconnected-prefix-foreground = ${colors.fg-dim}
label-disconnected = "aus"
label-disconnected-foreground = ${colors.fg-dim}

; ============================================================
;    Lautstärke
; ============================================================
[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
format-volume-prefix = "󰕾 "
format-volume-prefix-font = 2
format-volume-prefix-foreground = ${colors.purple-lt}
label-volume = %percentage%%
label-volume-foreground = ${colors.fg}

format-muted = <label-muted>
format-muted-prefix = "󰖁 "
format-muted-prefix-font = 2
format-muted-prefix-foreground = ${colors.red}
label-muted = stumm
label-muted-foreground = ${colors.fg-dim}

; ============================================================
;    Batterie
; ============================================================
[module/battery]
type = internal/battery
battery = BAT1
adapter = ACAD
poll-interval = 5
full-at = 99
low-at = 15

format-charging    = <label-charging>
format-charging-prefix = "󰂄 "
format-charging-prefix-font = 2
format-charging-prefix-foreground = ${colors.green}

format-discharging = <label-discharging>
format-discharging-prefix = "󰁹 "
format-discharging-prefix-font = 2
format-discharging-prefix-foreground = ${colors.yellow}

format-full = <label-full>
format-full-prefix = "󰁹 "
format-full-prefix-font = 2
format-full-prefix-foreground = ${colors.green}

format-low = <label-low>
format-low-prefix = "󰂃 "
format-low-prefix-font = 2
format-low-prefix-foreground = ${colors.red}

label-charging     = %percentage%%
label-discharging  = %percentage%%
label-full         = voll
label-low          = %percentage%% !
label-charging-foreground    = ${colors.fg}
label-discharging-foreground = ${colors.fg}
label-full-foreground        = ${colors.fg}
label-low-foreground         = ${colors.red}

; ============================================================
;    Helligkeit
; ============================================================
[module/backlight]
type = internal/backlight
card = intel_backlight
use-actual-brightness = true
enable-scroll = true
format = <label>
format-prefix = "󰃠 "
format-prefix-font = 2
format-prefix-foreground = ${colors.yellow}
label = %percentage%%
label-foreground = ${colors.fg}

; ============================================================
;    Bluetooth
; ============================================================
[module/bluetooth]
type = custom/script
interval = 2
exec = ~/.config/polybar/scripts/bluetooth.sh
click-left = ~/.config/polybar/scripts/bluetooth.sh toggle
format = <label>
label = %output%
label-foreground = ${colors.fg}
