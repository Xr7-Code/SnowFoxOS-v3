# ============================================================
#   SnowFoxOS v3 — picom Konfiguration
#   Minimal & Responsive: Schatten, Animationen, Runde Ecken
# ============================================================

# ── Backend ──────────────────────────────────────────────────
backend = "glx";
glx-no-stencil = true;
use-damage = true;
vsync = true;

# ── Fading (Sanfte Blenden-Animationen) ──────────────────────
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 5;

# ── Schatten ─────────────────────────────────────────────────
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.35;
shadow-offset-x = -7;
shadow-offset-y = -7;

shadow-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'i3lock'",
    "class_g = 'Dunst'",
    "_GTK_FRAME_EXTENTS@:c",
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

# ── Runde Ecken ───────────────────────────────────────────────
corner-radius = 10;

rounded-corners-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'i3lock'",
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

# ── Sonstiges ────────────────────────────────────────────────
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
log-level = "warn";
