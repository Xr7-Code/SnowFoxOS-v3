# ============================================================
#   SnowFoxOS v3 — picom Konfiguration
#   Minimal: nur Schatten + runde Ecken, kein Blur
#   Backend: glx (GPU-beschleunigt, stabil auf Hybrid-Systemen)
# ============================================================

# ── Backend ──────────────────────────────────────────────────
backend = "glx";
glx-no-stencil = true;
glx-copy-from-front = false;
use-damage = true;
vsync = true;

# ── Schatten ─────────────────────────────────────────────────
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.4;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-color = "#000000";

# Kein Schatten auf: Polybar, Rofi-Dropdown, i3lock, Desktop
shadow-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'i3lock'",
    "_GTK_FRAME_EXTENTS@:c",
    "name = 'Notification'",
    "class_g = 'Conky'",
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

# ── Runde Ecken ───────────────────────────────────────────────
corner-radius = 10;
rounded-corners-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'i3lock'",
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

# ── Transparenz ───────────────────────────────────────────────
# Inaktive Fenster leicht abdunkeln — gibt Tiefe wie bei Zorin
inactive-dim = 0.05;
inactive-dim-fixed = true;

# ── Fade ─────────────────────────────────────────────────────
# Sanftes Ein-/Ausblenden — subtil, nicht aufdringlich
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 6;

fade-exclude = [
    "class_g = 'i3lock'"
];

# ── Sonstiges ────────────────────────────────────────────────
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
log-level = "warn";
