# ============================================================
#   SnowFoxOS v3 — picom Konfiguration
#   Design: Weiche Schatten, subtiles Dimming, runde Ecken
#   Abgestimmt auf Polybar floating-bar Design
# ============================================================

# ── Backend ──────────────────────────────────────────────────
backend          = "xrender";
# glx-no-stencil   = true;
use-damage       = true;
vsync            = true;

# ── Inactive Dimming ─────────────────────────────────────────
# Subtiler als vorher — 0.15 statt 0.2 damit es nicht zu aggressiv wirkt
inactive-dim       = 0.15;
inactive-dim-fixed = true;

# ── Fading ───────────────────────────────────────────────────
# Etwas schneller als vorher für snappiges Gefühl
fading        = true;
fade-in-step  = 0.06;
fade-out-step = 0.06;
fade-delta    = 4;

# ── Schatten ─────────────────────────────────────────────────
# Größerer Radius, niedrigere Opacity = weicher, moderner
# Offset symmetrisch nach unten-rechts für natürlicheres Licht
shadow         = true;
shadow-radius  = 20;
shadow-opacity = 0.25;
shadow-offset-x = -10;
shadow-offset-y = 6;
shadow-color   = "#0d0b14";

shadow-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'i3lock'",
    "class_g = 'Dunst'",
    "class_g = 'Rofi'",
    "_GTK_FRAME_EXTENTS@:c",
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "window_type = 'tooltip'",
    "window_type = 'popup_menu'",
    "window_type = 'dropdown_menu'"
];

# ── Runde Ecken ──────────────────────────────────────────────
# 12px — etwas mehr als vorher, harmoniert mit Polybar-Modulen
corner-radius = 12;

rounded-corners-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'i3lock'",
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

# ── Opacity Rules ────────────────────────────────────────────
# Terminal leicht transparent wenn inaktiv — subtil, nicht ablenkend
opacity-rule = [
    "90:class_g = 'kitty' && !focused",
    "95:class_g = 'URxvt' && !focused",
    "88:class_g = 'Pcmanfm' && !focused"
];

# ── Blur (optional, nur wenn Performance es erlaubt) ─────────
# Auskommentiert — aktivieren mit: blur-method = "dual_kawase"
# blur-method = "dual_kawase";
# blur-strength = 4;
# blur-background = true;
# blur-background-exclude = [
#     "class_g = 'Polybar'",
#     "window_type = 'dock'",
#     "window_type = 'desktop'"
# ];

# ── Sonstiges ────────────────────────────────────────────────
mark-wmwin-focused     = true;
mark-ovredir-focused   = true;
detect-rounded-corners = true;
detect-client-opacity  = true;
detect-transient       = true;
log-level              = "warn";
