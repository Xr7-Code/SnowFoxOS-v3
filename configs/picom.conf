# ============================================================
#   SnowFoxOS v3 — picom Configuration
#   Design: soft shadows, subtle dimming, rounded corners
#   Tuned for the Polybar floating-bar design
#   Copyright (c) 2026 Alexander Valentin Ludwig (Xr7-Code)
# ============================================================

# ── Backend ──────────────────────────────────────────────────
backend          = "glx";
# glx-no-stencil   = true;
use-damage       = true;
vsync            = true;

# ── Inactive Dimming ─────────────────────────────────────────
# Subtler than before — 0.15 instead of 0.2 to avoid an aggressive look
inactive-dim       = 0.15;
inactive-dim-fixed = true;

# ── Fading ───────────────────────────────────────────────────
# Disabled — v2.2 behavior, significantly reduces compositor load
fading        = false;
fade-in-step  = 0.06;
fade-out-step = 0.06;
fade-delta    = 4;

# ── Shadows ──────────────────────────────────────────────────
# Larger radius, lower opacity = softer, more modern
# Offset symmetric toward bottom-right for more natural lighting
shadow         = true;
shadow-radius  = 20;
shadow-opacity = 0.25;
shadow-offset-x = -10;
shadow-offset-y = 6;
shadow-color   = "#0d0b14";

shadow-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'i3lock'",
    "class_g = 'Dunst'",
    "class_g = 'Rofi'",
    "_GTK_FRAME_EXTENTS@:c",
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "window_type = 'tooltip'",
    "window_type = 'popup_menu'",
    "window_type = 'dropdown_menu'"
];

# ── Rounded Corners ──────────────────────────────────────────
# 12px — slightly more than before, harmonizes with Polybar modules
corner-radius = 12;

rounded-corners-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'i3lock'",
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

# ── Opacity Rules ────────────────────────────────────────────
# Terminal slightly transparent when inactive — subtle, not distracting
opacity-rule = [
    "90:class_g = 'kitty' && !focused",
    "95:class_g = 'URxvt' && !focused",
    "88:class_g = 'Pcmanfm' && !focused"
];

# ── Blur (optional, only if performance allows) ──────────────
# Commented out — enable with: blur-method = "dual_kawase"
# blur-method = "dual_kawase";
# blur-strength = 4;
# blur-background = true;
# blur-background-exclude = [
#     "class_g = 'Polybar'",
#     "window_type = 'dock'",
#     "window_type = 'desktop'"
# ];

# ── Misc ─────────────────────────────────────────────────────
mark-wmwin-focused     = true;
mark-ovredir-focused   = true;
detect-rounded-corners = true;
detect-client-opacity  = true;
detect-transient       = true;
log-level              = "warn";
