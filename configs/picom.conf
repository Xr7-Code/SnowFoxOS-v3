# ============================================================
#   SnowFoxOS v3 — picom Konfiguration
#   Minimal: nur Schatten + runde Ecken
# ============================================================

# ── Backend ──────────────────────────────────────────────────
backend = "glx";
glx-no-stencil = true;
use-damage = true;
vsync = true;

# ── Schatten ─────────────────────────────────────────────────
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.4;
shadow-offset-x = -8;
shadow-offset-y = -8;

shadow-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'i3lock'",
    "class_g = 'Dunst'",
    "_GTK_FRAME_EXTENTS@:c",
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

# ── Runde Ecken ───────────────────────────────────────────────
corner-radius = 10;

rounded-corners-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'i3lock'",
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

# ── Sonstiges ────────────────────────────────────────────────
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
log-level = "warn";
